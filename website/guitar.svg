<?xml version="1.0" encoding="UTF-8"?>
<!-- GUITAR. Six strings, strummed across, and nothing else moves.
     Replaces guitar-detail. Drawn, not photographed. No people. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A classical guitar on a stand in a music room">
  <defs>
    <filter id="far" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="near" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3.4"/></filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3f2a4c"/><stop offset="0.6" stop-color="#32203c"/><stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4069"/><stop offset="1" stop-color="#33223c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.5"/><stop offset="1" stop-color="#ff98ae" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0.68" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffe9cf" stop-opacity="0.2"/><stop offset="0.55" stop-color="#ffdcc0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffdcc0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0dc" stop-opacity="0.26"/><stop offset="0.55" stop-color="#ffd6bf" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffd6bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.72" cy="0.26" r="0.74">
      <stop offset="0" stop-color="#ffdcb8" stop-opacity="0.3"/><stop offset="0.55" stop-color="#ffc8d4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffc8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="focusglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9c4" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="settle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0"/><stop offset="1" stop-color="#2b1933" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gwood" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a97bb8"/><stop offset="0.45" stop-color="#8a6096"/>
      <stop offset="1" stop-color="#5f4069"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fff6e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6e8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fff6e8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gbody"><path d="M572 462c-108 0-148 54-148 108 0 34 21 59 46 69-25 15-46 42-46 78 0 65 65 105 148 105s148-40 148-105c0-36-21-63-46-78 25-10 46-35 46-69 0-54-40-108-148-108z"/></clipPath>
  </defs>
  <style>
    .sun { animation: sun 9s ease-in-out infinite alternate; }
    .night { animation: night 9s ease-in-out infinite alternate; }
    .warm { animation: warm 9s ease-in-out infinite alternate; }
    .beam { filter: blur(15px); animation: beamlight 9s ease-in-out infinite alternate, beamdrift 31s ease-in-out infinite alternate; }
    .bloom { filter: blur(11px); }
    .subject { filter: blur(3.4px); animation: focuspull 6s ease-in-out infinite; }
    
    .subject-glow { transform-box: fill-box; transform-origin: center; opacity: 0; animation: glow 6s ease-in-out infinite; }
    @keyframes night { from { opacity: 0.56; } to { opacity: 0; } }
    @keyframes warm { from { opacity: 0; } to { opacity: 0.82; } }
    @keyframes sun { from { opacity: 0.12; } to { opacity: 1; } }
    @keyframes beamlight { from { opacity: 0.05; } to { opacity: 1; } }
    @keyframes beamdrift { from { transform: translateX(-16px); } to { transform: translateX(20px); } }
    @keyframes focuspull {
      0%, 40% { filter: blur(3.4px); } 52%, 78% { filter: blur(0px); } 92%, 100% { filter: blur(3.4px); }
    }
    @keyframes glow {
      0%, 42% { opacity: 0; transform: scale(0.7); } 54% { opacity: 1; transform: scale(1.14); }
      82%, 100% { opacity: 0; transform: scale(0.7); }
    }
    /* A STRUM, NOT A RING. Owner: the guitar should be "more about the
       strings". Each string carries a static core and two envelope lines that
       spread either side of it and decay - what a vibrating string actually
       looks like - and the six delays are staggered downward, so it reads as
       one hand going across them. The body gives a small shudder under it,
       because a guitar resonates; nothing else in the picture moves. */
    .str { transform-box: fill-box; transform-origin: center; }
    .env { transform-box: fill-box; transform-origin: center; opacity: 0;
      animation: pluck 6s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
    .shudder { transform-box: fill-box; transform-origin: 50% 90%;
      animation: shudder 6s ease-out infinite; }
    .sheen { animation: sheen 9s ease-in-out infinite alternate; }
    @keyframes sheen { from { transform: translateX(0); } to { transform: translateX(760px); } }
    @keyframes shudder {
      0%, 43% { transform: translateX(0) scaleX(1); }
      47% { transform: translateX(2.5px) scaleX(1.004); }
      52% { transform: translateX(-2px) scaleX(0.997); }
      57% { transform: translateX(1.2px); }
      62% { transform: translateX(-0.6px); }
      70%, 100% { transform: translateX(0) scaleX(1); }
    }
    @keyframes pluck {
      0%, 43% { opacity: 0; transform: translateX(0); }
      46% { opacity: 0.9; transform: translateX(var(--a)); }
      50% { transform: translateX(calc(var(--a) * -0.84)); }
      54% { transform: translateX(calc(var(--a) * 0.64)); }
      58% { transform: translateX(calc(var(--a) * -0.46)); }
      62% { transform: translateX(calc(var(--a) * 0.3)); }
      66% { transform: translateX(calc(var(--a) * -0.16)); }
      76% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sun, .night, .warm, .beam, .subject, .subject-body, .subject-glow,
      .keybed, .key, .shock, .pop, .env, .note,
      .hat-top, .hat-low, .hat-flash, .shudder, .sheen { animation: none; }
      .shock, .pop, .note, .hat-flash { opacity: 0; }
      .night { opacity: 0.1; } .warm { opacity: 0.7; } .subject-glow { opacity: 0; }
    }
  </style>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <g filter="url(#far)">
    <rect width="1200" height="800" fill="url(#wall)"/>
    <rect x="760" y="70" width="230" height="300" rx="10" fill="url(#glass)"/>
    <rect x="760" y="70" width="230" height="300" rx="10" fill="none" stroke="#d8c1dd" stroke-opacity="0.34" stroke-width="4"/>
    <g stroke="#2b1933" stroke-opacity="0.5" stroke-width="9"><path d="M875 70V370M760 220H990"/></g>
    <path d="M0 596H1200" stroke="#664c70" stroke-opacity="0.4" stroke-width="3"/>
    <g fill="none" stroke="#d8c1dd" stroke-opacity="0.22" stroke-width="4">
      <rect x="120" y="120" width="260" height="170" rx="6"/>
    </g>
    <g stroke="#d5fbff" stroke-opacity="0.26" stroke-width="3">
      <path d="M142 160H358M142 180H358M142 200H358M142 220H358M142 240H358"/>
    </g>
    <g fill="#ff98ae" fill-opacity="0.55">
      <ellipse cx="186" cy="220" rx="8" ry="6"/><ellipse cx="248" cy="180" rx="8" ry="6"/><ellipse cx="310" cy="200" rx="8" ry="6"/>
    </g>
    <g stroke="#ff98ae" stroke-opacity="0.5" stroke-width="3.4" stroke-linecap="round">
      <path d="M194 220V182M256 180V146M318 200V166"/>
    </g>
    <g fill="#d8c1dd" fill-opacity="0.16">
      <rect x="452" y="470" width="16" height="126" rx="3"/><rect x="474" y="484" width="16" height="112" rx="3"/>
      <rect x="496" y="462" width="16" height="134" rx="3"/>
    </g>
  </g>
  <g class="sun">
    <path class="beam" d="M760 370 L990 370 L1150 800 L560 800 Z" fill="url(#shaft)"/>
    <ellipse class="bloom" cx="875" cy="230" rx="230" ry="210" fill="url(#bloom)"/>
  </g>
  <g filter="url(#near)">
    <ellipse cx="572" cy="790" rx="320" ry="20" fill="#160c1a" fill-opacity="0.45"/>

    <!-- headstock: slotted, six tuners, a real shape rather than a box -->
    <path d="M534 120h76c14 0 24 10 24 24l6 66c1 12-8 22-20 22h-96c-12 0-21-10-20-22l6-66c0-14 10-24 24-24z" fill="#3f2a4c"/>
    <path d="M534 120h76c14 0 24 10 24 24l6 66c1 12-8 22-20 22h-96c-12 0-21-10-20-22l6-66c0-14 10-24 24-24z" fill="none" stroke="#d8c1dd" stroke-opacity="0.3" stroke-width="2.5"/>
    <rect x="530" y="146" width="15" height="62" rx="7.5" fill="#2b1933" fill-opacity="0.82"/>
    <rect x="599" y="146" width="15" height="62" rx="7.5" fill="#2b1933" fill-opacity="0.82"/>
    <g stroke="#d8c1dd" stroke-opacity="0.55" stroke-width="3.6" stroke-linecap="round">
      <path d="M528 160h-22M528 180h-22M528 200h-22M616 160h22M616 180h22M616 200h22"/>
    </g>
    <g fill="#d8c1dd" fill-opacity="0.44">
      <circle cx="500" cy="160" r="6"/><circle cx="500" cy="180" r="6"/><circle cx="500" cy="200" r="6"/>
      <circle cx="644" cy="160" r="6"/><circle cx="644" cy="180" r="6"/><circle cx="644" cy="200" r="6"/>
    </g>

    <!-- nut, neck, frets, inlays -->
    <rect x="530" y="228" width="84" height="9" rx="3" fill="#f4eaf6" fill-opacity="0.5"/>
    <path d="M530 237h84l12 228h-108z" fill="#4b3357"/>
    <path d="M530 237h84l12 228h-108z" fill="none" stroke="#2b1933" stroke-opacity="0.4" stroke-width="2"/>
    <g stroke="#d8c1dd" stroke-opacity="0.3" stroke-width="2.6">
      <path d="M532 271h80M534 305h82M536 339h84M538 373h86M540 407h88M542 441h90"/>
    </g>
    <g fill="#d8c1dd" stroke="none" fill-opacity="0.4">
      <circle cx="572" cy="288" r="4.5"/><circle cx="572" cy="356" r="4.5"/><circle cx="572" cy="424" r="4.5"/>
    </g>

    <!-- the body, with grain and a waist you can see -->
    <path d="M572 462c-108 0-148 54-148 108 0 34 21 59 46 69-25 15-46 42-46 78 0 65 65 105 148 105s148-40 148-105c0-36-21-63-46-78 25-10 46-35 46-69 0-54-40-108-148-108z" fill="url(#gwood)"/>
    <g clip-path="url(#gbody)">
      <g stroke="#2b1933" stroke-opacity="0.13" stroke-width="2.2" fill="none">
        <path d="M424 500c60 40 232 40 296 0M424 560c60 40 232 40 296 0M424 620c60 40 232 40 296 0M424 680c60 40 232 40 296 0M424 740c60 40 232 40 296 0"/>
      </g>
      <rect class="sheen" x="-320" y="380" width="200" height="460" fill="url(#sheen)"/>
      <!-- pickguard -->
      <path d="M636 606c34 10 46 40 36 66-10 26-42 34-64 20z" fill="#2b1933" fill-opacity="0.34"/>
    </g>
    <path d="M572 462c-108 0-148 54-148 108 0 34 21 59 46 69-25 15-46 42-46 78 0 65 65 105 148 105s148-40 148-105c0-36-21-63-46-78 25-10 46-35 46-69 0-54-40-108-148-108z" fill="none" stroke="#d8c1dd" stroke-opacity="0.5" stroke-width="3.5"/>

    <!-- soundhole and rosette -->
    <circle cx="572" cy="586" r="52" fill="#1d1122"/>
    <circle cx="572" cy="586" r="52" fill="none" stroke="#2b1933" stroke-opacity="0.9" stroke-width="3"/>
    <circle cx="572" cy="586" r="60" fill="none" stroke="#ffd9c4" stroke-opacity="0.5" stroke-width="5"/>
    <circle cx="572" cy="586" r="68" fill="none" stroke="#d8c1dd" stroke-opacity="0.3" stroke-width="2.5"/>
    <circle cx="572" cy="586" r="74" fill="none" stroke="#ffd9c4" stroke-opacity="0.22" stroke-width="2"/>

    <!-- bridge, saddle and six pins -->
    <path d="M506 694h132a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10H506a10 10 0 0 1-10-10v-20a10 10 0 0 1 10-10z" fill="#3f2a4c"/>
    <rect x="508" y="690" width="128" height="7" rx="3" fill="#f4eaf6" fill-opacity="0.44"/>
    <g fill="#f4eaf6" fill-opacity="0.6">
      <circle cx="521" cy="714" r="4.5"/><circle cx="542" cy="714" r="4.5"/><circle cx="563" cy="714" r="4.5"/>
      <circle cx="584" cy="714" r="4.5"/><circle cx="605" cy="714" r="4.5"/><circle cx="626" cy="714" r="4.5"/>
    </g>  </g>
  <g class="keyboard" filter="url(#near)">
  </g>

  <g class="subject">
    <ellipse class="subject-glow" cx="572" cy="470" rx="310" ry="300" fill="url(#focusglow)"/>
    <g class="shudder">
      <g class="str">
        <path class="env" style="--a:4.0px;animation-delay:0.000s" d="M536.0 232 L521.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path class="env" style="--a:-4.0px;animation-delay:0.000s" d="M536.0 232 L521.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path d="M536.0 232 L521.0 700" stroke="#fdf6ff" stroke-opacity="0.8" stroke-width="1.5" fill="none"/>
      </g>
      <g class="str">
        <path class="env" style="--a:5.6px;animation-delay:0.055s" d="M544.8 232 L542.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path class="env" style="--a:-5.6px;animation-delay:0.055s" d="M544.8 232 L542.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path d="M544.8 232 L542.0 700" stroke="#fdf6ff" stroke-opacity="0.8" stroke-width="1.9" fill="none"/>
      </g>
      <g class="str">
        <path class="env" style="--a:7.2px;animation-delay:0.110s" d="M553.6 232 L563.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path class="env" style="--a:-7.2px;animation-delay:0.110s" d="M553.6 232 L563.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path d="M553.6 232 L563.0 700" stroke="#fdf6ff" stroke-opacity="0.8" stroke-width="2.4" fill="none"/>
      </g>
      <g class="str">
        <path class="env" style="--a:8.8px;animation-delay:0.165s" d="M562.4 232 L584.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path class="env" style="--a:-8.8px;animation-delay:0.165s" d="M562.4 232 L584.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path d="M562.4 232 L584.0 700" stroke="#fdf6ff" stroke-opacity="0.8" stroke-width="2.9" fill="none"/>
      </g>
      <g class="str">
        <path class="env" style="--a:10.4px;animation-delay:0.220s" d="M571.2 232 L605.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path class="env" style="--a:-10.4px;animation-delay:0.220s" d="M571.2 232 L605.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path d="M571.2 232 L605.0 700" stroke="#fdf6ff" stroke-opacity="0.8" stroke-width="3.3" fill="none"/>
      </g>
      <g class="str">
        <path class="env" style="--a:12.0px;animation-delay:0.275s" d="M580.0 232 L626.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path class="env" style="--a:-12.0px;animation-delay:0.275s" d="M580.0 232 L626.0 700" stroke="#fff6e8" stroke-opacity="0.5" stroke-width="2.2" fill="none"/>
        <path d="M580.0 232 L626.0 700" stroke="#fdf6ff" stroke-opacity="0.8" stroke-width="3.8" fill="none"/>
      </g>
    </g>  </g>
  <rect class="night" width="1200" height="800" fill="#170c1c"/>
  <rect class="warm" width="1200" height="800" fill="url(#warm)"/>
  <rect y="600" width="1200" height="200" fill="url(#settle)"/>
</svg>
