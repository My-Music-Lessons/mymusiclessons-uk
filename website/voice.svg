<?xml version="1.0" encoding="UTF-8"?>
<!-- VOICE. The notes lift off the stave and do not come back.
     Replaces singing-detail. Drawn, not photographed. No people. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="An open songbook on a music stand in a music room">
  <defs>
    <filter id="far" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="near" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3.4"/></filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3f2a4c"/><stop offset="0.6" stop-color="#32203c"/><stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4069"/><stop offset="1" stop-color="#33223c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.5"/><stop offset="1" stop-color="#ff98ae" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0.68" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffe9cf" stop-opacity="0.2"/><stop offset="0.55" stop-color="#ffdcc0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffdcc0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0dc" stop-opacity="0.26"/><stop offset="0.55" stop-color="#ffd6bf" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffd6bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.72" cy="0.26" r="0.74">
      <stop offset="0" stop-color="#ffdcb8" stop-opacity="0.3"/><stop offset="0.55" stop-color="#ffc8d4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffc8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="focusglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.55"/><stop offset="1" stop-color="#d5fbff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="settle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0"/><stop offset="1" stop-color="#2b1933" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    .sun { animation: sun 9s ease-in-out infinite alternate; }
    .night { animation: night 9s ease-in-out infinite alternate; }
    .warm { animation: warm 9s ease-in-out infinite alternate; }
    .beam { filter: blur(15px); animation: beamlight 9s ease-in-out infinite alternate, beamdrift 31s ease-in-out infinite alternate; }
    .bloom { filter: blur(11px); }
    .subject { filter: blur(3.4px); animation: focuspull 6s ease-in-out infinite; }
    
    .subject-glow { transform-box: fill-box; transform-origin: center; opacity: 0; animation: glow 6s ease-in-out infinite; }
    @keyframes night { from { opacity: 0.56; } to { opacity: 0; } }
    @keyframes warm { from { opacity: 0; } to { opacity: 0.82; } }
    @keyframes sun { from { opacity: 0.12; } to { opacity: 1; } }
    @keyframes beamlight { from { opacity: 0.05; } to { opacity: 1; } }
    @keyframes beamdrift { from { transform: translateX(-16px); } to { transform: translateX(20px); } }
    @keyframes focuspull {
      0%, 40% { filter: blur(3.4px); } 52%, 78% { filter: blur(0px); } 92%, 100% { filter: blur(3.4px); }
    }
    @keyframes glow {
      0%, 42% { opacity: 0; transform: scale(0.7); } 54% { opacity: 1; transform: scale(1.14); }
      82%, 100% { opacity: 0; transform: scale(0.7); }
    }
    /* THE NOTES LEAVE. Owner, 24 September: vocals was too similar to the
       rest. Nothing on this one expands or rings - the notes lift off the
       stave and go, each with its own height, drift, tilt and delay, and none
       of them comes back. That is the difference between an instrument, which
       sounds where it stands, and a voice, which does not. */
    .note { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0;
      animation: leave 6s cubic-bezier(0.3, 0.7, 0.4, 1) infinite; }
    @keyframes leave {
      0%, 40% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0.6); }
      48% { opacity: 0.95; transform: translate(0, -20px) rotate(0deg) scale(var(--s)); }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(var(--s)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sun, .night, .warm, .beam, .subject, .subject-body, .subject-glow,
      .keybed, .key, .shock, .pop, .env, .note,
      .hat-top, .hat-low, .hat-flash, .shudder, .sheen { animation: none; }
      .shock, .pop, .note, .hat-flash { opacity: 0; }
      .night { opacity: 0.1; } .warm { opacity: 0.7; } .subject-glow { opacity: 0; }
    }
  </style>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <g filter="url(#far)">
    <rect width="1200" height="800" fill="url(#wall)"/>
    <rect x="760" y="70" width="230" height="300" rx="10" fill="url(#glass)"/>
    <rect x="760" y="70" width="230" height="300" rx="10" fill="none" stroke="#d8c1dd" stroke-opacity="0.34" stroke-width="4"/>
    <g stroke="#2b1933" stroke-opacity="0.5" stroke-width="9"><path d="M875 70V370M760 220H990"/></g>
    <path d="M0 596H1200" stroke="#664c70" stroke-opacity="0.4" stroke-width="3"/>
    <g fill="none" stroke="#d8c1dd" stroke-opacity="0.22" stroke-width="4">
      <rect x="120" y="120" width="260" height="170" rx="6"/>
    </g>
    <g stroke="#d5fbff" stroke-opacity="0.26" stroke-width="3">
      <path d="M142 160H358M142 180H358M142 200H358M142 220H358M142 240H358"/>
    </g>
    <g fill="#ff98ae" fill-opacity="0.55">
      <ellipse cx="186" cy="220" rx="8" ry="6"/><ellipse cx="248" cy="180" rx="8" ry="6"/><ellipse cx="310" cy="200" rx="8" ry="6"/>
    </g>
    <g stroke="#ff98ae" stroke-opacity="0.5" stroke-width="3.4" stroke-linecap="round">
      <path d="M194 220V182M256 180V146M318 200V166"/>
    </g>
    <g fill="#d8c1dd" fill-opacity="0.16">
      <rect x="452" y="470" width="16" height="126" rx="3"/><rect x="474" y="484" width="16" height="112" rx="3"/>
      <rect x="496" y="462" width="16" height="134" rx="3"/>
    </g>
  </g>
  <g class="sun">
    <path class="beam" d="M760 370 L990 370 L1150 800 L560 800 Z" fill="url(#shaft)"/>
    <ellipse class="bloom" cx="875" cy="230" rx="230" ry="210" fill="url(#bloom)"/>
  </g>
  <g filter="url(#near)">
    <ellipse cx="600" cy="782" rx="330" ry="22" fill="#160c1a" fill-opacity="0.45"/>
    <path d="M600 620V764M510 780h180" stroke="#d8c1dd" stroke-opacity="0.26" stroke-width="9" stroke-linecap="round"/>  </g>
  <g class="keyboard" filter="url(#near)">
  </g>

  <g class="subject">
    <ellipse class="subject-glow" cx="600" cy="470" rx="300" ry="230" fill="url(#focusglow)"/>
    <g class="subject-body">
      <path d="M600 430 L380 396 L380 604 L600 634 Z" fill="#f4eaf6" fill-opacity="0.26"/>
      <path d="M600 430 L820 396 L820 604 L600 634 Z" fill="#f4eaf6" fill-opacity="0.34"/>
      <path d="M600 430V634" stroke="#d8c1dd" stroke-opacity="0.55" stroke-width="3"/>
      <g stroke="#2b1933" stroke-opacity="0.36" stroke-width="2.4">
        <path d="M402 442 L582 470M402 468 L582 496M402 494 L582 522M402 520 L582 548M402 546 L582 574"/>
        <path d="M618 470 L798 442M618 496 L798 468M618 522 L798 494M618 548 L798 520M618 574 L798 546"/>
      </g>
    </g>
      <g class="note" style="--y:-343px;--x:49px;--r:22deg;--s:0.81;animation-delay:0.599s">
        <ellipse cx="402" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M411 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M411 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-321px;--x:87px;--r:-9deg;--s:0.79;animation-delay:0.313s">
        <ellipse cx="448" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M457 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M457 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-210px;--x:82px;--r:20deg;--s:1.00;animation-delay:0.458s">
        <ellipse cx="493" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M502 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M502 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-359px;--x:-67px;--r:-7deg;--s:1.12;animation-delay:0.025s">
        <ellipse cx="525" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M534 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M534 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-207px;--x:48px;--r:20deg;--s:0.81;animation-delay:0.414s">
        <ellipse cx="583" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M592 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M592 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-275px;--x:57px;--r:-8deg;--s:0.85;animation-delay:0.320s">
        <ellipse cx="615" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M624 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M624 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-221px;--x:-5px;--r:13deg;--s:0.73;animation-delay:0.359s">
        <ellipse cx="669" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M678 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M678 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-227px;--x:32px;--r:-15deg;--s:1.16;animation-delay:0.271s">
        <ellipse cx="714" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M723 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M723 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="note" style="--y:-200px;--x:-16px;--r:-7deg;--s:1.17;animation-delay:0.329s">
        <ellipse cx="761" cy="530" rx="11" ry="8.4" fill="#ff98ae" fill-opacity="0.9"/>
        <path d="M770 530V476" stroke="#ff98ae" stroke-opacity="0.85" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M770 476c14 4 18 14 14 24" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>  </g>
  <rect class="night" width="1200" height="800" fill="#170c1c"/>
  <rect class="warm" width="1200" height="800" fill="url(#warm)"/>
  <rect y="600" width="1200" height="200" fill="url(#settle)"/>
</svg>
