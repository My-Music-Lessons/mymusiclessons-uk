<?xml version="1.0" encoding="UTF-8"?>
<!-- SINGING. An open book on a stand against a tall window, and the one backlit scene in the
     set: the light is behind the subject, so the book is a shape rather than a lit object.
     That alone makes it read as a different photograph from the other five. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A drawing of an open songbook on a stand, silhouetted against a tall window">
  <defs>
    <filter id="far" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="near" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3.4"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#35223f"/><stop offset="0.6" stop-color="#2d1c37"/><stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241429"/><stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.5"/><stop offset="1" stop-color="#ff98ae" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffe9cf" stop-opacity="0.2"/><stop offset="0.55" stop-color="#ffdcc0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffdcc0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0dc" stop-opacity="0.26"/><stop offset="0.55" stop-color="#ffd6bf" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffd6bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.3" r="0.74">
      <stop offset="0" stop-color="#ffdcb8" stop-opacity="0.3"/><stop offset="0.55" stop-color="#ffc8d4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffc8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="focusglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9c4" stop-opacity="0.5"/><stop offset="1" stop-color="#ffd9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="settletop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0.3"/><stop offset="1" stop-color="#2b1933" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="settlebottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0"/><stop offset="1" stop-color="#2b1933" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <style>
    /* The same clock the three big rooms run, so a slice and a band read as
       one building. */
    .night { animation: night 9s ease-in-out infinite alternate; }
    .warm { animation: warm 9s ease-in-out infinite alternate; }
    .sun { animation: sun 9s ease-in-out infinite alternate; }
    .beam { filter: blur(15px); animation: sun 9s ease-in-out infinite alternate, drift 31s ease-in-out infinite alternate; }
    .bloom { filter: blur(11px); }
    /* One object comes into focus, on the 6s beat the front desk bell set. */
    .subject { filter: blur(3.4px); animation: subjectfocus 6s ease-in-out infinite; }
    .subject-body { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; }
    .subject-glow { transform-box: fill-box; transform-origin: center; opacity: 0; animation: subjectglow 6s ease-in-out infinite; }
    @keyframes night { from { opacity: 0.5; } to { opacity: 0.04; } }
    @keyframes warm { from { opacity: 0; } to { opacity: 0.7; } }
    @keyframes sun { from { opacity: 0.14; } to { opacity: 0.74; } }
    @keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(20px); } }
    @keyframes subjectfocus {
      0%, 44% { filter: blur(3.4px); } 56%, 76% { filter: blur(0px); } 92%, 100% { filter: blur(3.4px); }
    }
    @keyframes subjectglow {
      0%, 46% { opacity: 0; transform: scale(0.76); } 58% { opacity: 1; transform: scale(1.1); }
      84%, 100% { opacity: 0; transform: scale(0.76); }
    }
    @keyframes lift {
      0%, 48% { transform: translateY(0) scale(1); } 60% { transform: translateY(-10px) scale(1.02); }
      76% { transform: translateY(-4px) scale(1.008); } 90%, 100% { transform: translateY(0) scale(1); }
    }
    @keyframes sway {
      0%, 48% { transform: rotate(0deg); } 60% { transform: rotate(-2.2deg); }
      74% { transform: rotate(1.4deg); } 88%, 100% { transform: rotate(0deg); }
    }
    @keyframes crash {
      0%, 46% { transform: translateY(0); } 56% { transform: translateY(16px); }
      64% { transform: translateY(9px); } 72% { transform: translateY(14px); }
      86%, 100% { transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 48% { transform: scale(1); } 60% { transform: scale(1.035); }
      78% { transform: scale(1.012); } 92%, 100% { transform: scale(1); }
    }
    /* An image cannot be told by the page that embeds it, so the guard lives
       in here, and every scene settles lit rather than dark. */
    @media (prefers-reduced-motion: reduce) {
      .night, .warm, .sun, .beam, .subject, .subject-body, .subject-glow { animation: none; }
      .night { opacity: 0.08; } .warm { opacity: 0.6; } .sun { opacity: 0.66; }
      .subject-glow { opacity: 0; }
    }
  </style>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="640" width="1200" height="160" fill="url(#ground)"/>

  <g filter="url(#far)">
    <rect width="1200" height="800" fill="url(#wall)"/>
    <rect y="640" width="1200" height="160" fill="url(#ground)"/>
    <!-- the window, tall, and most of the frame -->
    <rect x="300" y="30" width="600" height="600" rx="16" fill="url(#glass)"/>
    <g stroke="#1e1024" stroke-opacity="0.66" stroke-width="16">
      <path d="M600 30V630M300 230H900M300 430H900"/>
    </g>
    <rect x="300" y="30" width="600" height="600" rx="16" fill="none" stroke="#1e1024" stroke-opacity="0.5" stroke-width="18"/>
    <path d="M0 640H1200" stroke="#664c70" stroke-opacity="0.34" stroke-width="5"/>
    <!-- the sill, and what the window puts on the floor -->
    <path d="M300 630 H900 L1000 800 H200 Z" fill="#d5fbff" fill-opacity="0.05"/>
  </g>

  <ellipse class="sun bloom" cx="600" cy="300" rx="460" ry="400" fill="url(#bloom)"/>
  <rect class="sun" x="300" y="30" width="600" height="600" rx="16" fill="#fff6e8" fill-opacity="0.26"/>

  <g filter="url(#near)">
    <ellipse filter="url(#soft)" cx="600" cy="782" rx="220" ry="26" fill="#160c1b" fill-opacity="0.5"/>
    <!-- the stand, a silhouette because everything here is -->
    <path d="M600 470 V760" stroke="#1e1024" stroke-width="14"/>
    <path d="M510 782 L600 740 L690 782" fill="none" stroke="#1e1024" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g class="subject">
    <ellipse class="subject-glow" cx="600" cy="400" rx="300" ry="220" fill="url(#focusglow)"/>
    <g class="subject-body">
      <!-- the book, open, dark against the light -->
      <path d="M600 400 L376 356 L376 528 L600 496 Z" fill="#1e1024" fill-opacity="0.92"/>
      <path d="M600 400 L824 356 L824 528 L600 496 Z" fill="#241429" fill-opacity="0.92"/>
      <path d="M600 400 V496" stroke="#d8c1dd" stroke-opacity="0.34" stroke-width="4"/>
      <g stroke="#d8c1dd" stroke-opacity="0.26" stroke-width="4">
        <path d="M410 392 H566M410 420 H566M410 448 H566M410 476 H566"/>
        <path d="M634 392 H790M634 420 H790M634 448 H790M634 476 H790"/>
      </g>
      <path d="M600 400 L376 356M600 400 L824 356" fill="none" stroke="#f4eaf6" stroke-opacity="0.44" stroke-width="4"/>
    </g>
  </g>

  <rect class="night" width="1200" height="800" fill="#170c1c"/>
  <rect class="warm" width="1200" height="800" fill="url(#warm)"/>
  <rect width="1200" height="180" fill="url(#settletop)"/>
  <rect y="620" width="1200" height="180" fill="url(#settlebottom)"/>
</svg>
