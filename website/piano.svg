      <rect x="452" y="470" width="16" height="126" rx="3"/><rect x="474" y="484" width="16" height="112" rx="3"/>
      <rect x="496" y="462" width="16" height="134" rx="3"/>
    </g>
  </g>
  <g class="sun">
    <path class="beam" d="M760 370 L990 370 L1150 800 L560 800 Z" fill="url(#shaft)"/>
    <ellipse class="bloom" cx="875" cy="230" rx="230" ry="210" fill="url(#bloom)"/>
  </g>
  <g filter="url(#near)">
    <ellipse cx="620" cy="770" rx="470" ry="26" fill="#160c1a" fill-opacity="0.5"/>
    <path d="M300 620h500a86 86 0 0 1 86 86v34a24 24 0 0 1-24 24H324a24 24 0 0 1-24-24z" fill="#4b3357"/>
    <path d="M300 620h500a86 86 0 0 1 86 86H300z" fill="url(#surface)"/>
  </g>
