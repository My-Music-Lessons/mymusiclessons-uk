<?xml version="1.0" encoding="UTF-8"?>
<!-- THE PIANO, and deliberately an UPRIGHT seen from the side. hall-room.svg already has a
     grand with its lid up, and two drawings of the same instrument in one theme is the exact
     fault this delivery exists to fix. Light from a high window off-frame right. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A drawing of an upright piano against a classroom wall with its stool pulled out">
  <defs>
    <filter id="far" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="near" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3.4"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="#3d2749"/><stop offset="0.6" stop-color="#31203c"/><stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1830"/><stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.5"/><stop offset="1" stop-color="#ff98ae" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0.86" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffe9cf" stop-opacity="0.2"/><stop offset="0.55" stop-color="#ffdcc0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffdcc0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0dc" stop-opacity="0.26"/><stop offset="0.55" stop-color="#ffd6bf" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffd6bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.82" cy="0.24" r="0.74">
      <stop offset="0" stop-color="#ffdcb8" stop-opacity="0.3"/><stop offset="0.55" stop-color="#ffc8d4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffc8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="focusglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9c4" stop-opacity="0.5"/><stop offset="1" stop-color="#ffd9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="settletop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0.3"/><stop offset="1" stop-color="#2b1933" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="settlebottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0"/><stop offset="1" stop-color="#2b1933" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <style>
    /* The same clock the three big rooms run, so a slice and a band read as
       one building. */
    .night { animation: night 9s ease-in-out infinite alternate; }
    .warm { animation: warm 9s ease-in-out infinite alternate; }
    .sun { animation: sun 9s ease-in-out infinite alternate; }
    .beam { filter: blur(15px); animation: sun 9s ease-in-out infinite alternate, drift 31s ease-in-out infinite alternate; }
    .bloom { filter: blur(11px); }
    /* One object comes into focus, on the 6s beat the front desk bell set. */
    .subject { filter: blur(3.4px); animation: subjectfocus 6s ease-in-out infinite; }
    .subject-body { transform-box: fill-box; transform-origin: 50% 100%; animation: lift 6s ease-in-out infinite; }
    .subject-glow { transform-box: fill-box; transform-origin: center; opacity: 0; animation: subjectglow 6s ease-in-out infinite; }
    @keyframes night { from { opacity: 0.5; } to { opacity: 0.04; } }
    @keyframes warm { from { opacity: 0; } to { opacity: 0.7; } }
    @keyframes sun { from { opacity: 0.14; } to { opacity: 0.74; } }
    @keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(20px); } }
    @keyframes subjectfocus {
      0%, 44% { filter: blur(3.4px); } 56%, 76% { filter: blur(0px); } 92%, 100% { filter: blur(3.4px); }
    }
    @keyframes subjectglow {
      0%, 46% { opacity: 0; transform: scale(0.76); } 58% { opacity: 1; transform: scale(1.1); }
      84%, 100% { opacity: 0; transform: scale(0.76); }
    }
    @keyframes lift {
      0%, 48% { transform: translateY(0) scale(1); } 60% { transform: translateY(-10px) scale(1.02); }
      76% { transform: translateY(-4px) scale(1.008); } 90%, 100% { transform: translateY(0) scale(1); }
    }
    @keyframes sway {
      0%, 48% { transform: rotate(0deg); } 60% { transform: rotate(-2.2deg); }
      74% { transform: rotate(1.4deg); } 88%, 100% { transform: rotate(0deg); }
    }
    @keyframes crash {
      0%, 46% { transform: translateY(0); } 56% { transform: translateY(16px); }
      64% { transform: translateY(9px); } 72% { transform: translateY(14px); }
      86%, 100% { transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 48% { transform: scale(1); } 60% { transform: scale(1.035); }
      78% { transform: scale(1.012); } 92%, 100% { transform: scale(1); }
    }
    /* An image cannot be told by the page that embeds it, so the guard lives
       in here, and every scene settles lit rather than dark. */
    @media (prefers-reduced-motion: reduce) {
      .night, .warm, .sun, .beam, .subject, .subject-body, .subject-glow { animation: none; }
      .night { opacity: 0.08; } .warm { opacity: 0.6; } .sun { opacity: 0.66; }
      .subject-glow { opacity: 0; }
    }
  </style>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="600" width="1200" height="200" fill="url(#ground)"/>

  <g filter="url(#far)">
    <rect width="1200" height="800" fill="url(#wall)"/>
    <rect y="600" width="1200" height="200" fill="url(#ground)"/>
    <path d="M0 600H1200" stroke="#664c70" stroke-opacity="0.4" stroke-width="5"/>
    <!-- a picture rail and two frames, high on the wall -->
    <path d="M0 210 H1200" stroke="#664c70" stroke-opacity="0.3" stroke-width="6"/>
    <g fill="none" stroke="#d8c1dd" stroke-opacity="0.3" stroke-width="7">
      <rect x="120" y="70" width="180" height="120" rx="6"/>
      <rect x="360" y="90" width="140" height="100" rx="6"/>
    </g>
    <!-- the skirting, so the wall meets the floor somewhere -->
    <path d="M0 576 H1200" stroke="#8a6096" stroke-opacity="0.3" stroke-width="10"/>
  </g>

  <path class="beam" d="M1200 60 L1200 260 L700 800 L1060 800 Z" fill="url(#shaft)"/>
  <ellipse class="sun bloom" cx="1040" cy="300" rx="400" ry="380" fill="url(#bloom)"/>

  <g filter="url(#near)">
    <ellipse filter="url(#soft)" cx="520" cy="740" rx="420" ry="34" fill="#160c1b" fill-opacity="0.5"/>
    <!-- the stool, pulled out and nearest the camera -->
    <rect x="760" y="640" width="200" height="26" rx="10" fill="#4b3357"/>
    <path d="M790 666 V754M930 666 V754" stroke="#4b3357" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g class="subject">
    <ellipse class="subject-glow" cx="440" cy="450" rx="380" ry="280" fill="url(#focusglow)"/>
    <g class="subject-body">
      <!-- the case, side on: tall back, the keyslip stepping out at the front -->
      <!-- the lid, overhanging at both ends, which is the shape of an upright -->
      <path d="M118 244 H732 V286 H118 Z" fill="#674a75"/>
      <path d="M118 244 H732" stroke="#d8c1dd" stroke-opacity="0.5" stroke-width="7"/>
      <!-- the top panel, set back under it -->
      <path d="M150 286 H700 V430 H150 Z" fill="#4b3357"/>
      <path d="M176 306 H674 V410 H176 Z" fill="#3a2744" fill-opacity="0.7"/>
      <!-- the lower panel and the legs -->
      <path d="M150 536 H700 V690 H150 Z" fill="#4b3357"/>
      <path d="M176 556 H674 V670 H176 Z" fill="#3a2744" fill-opacity="0.55"/>
      <path d="M156 690 H206 V732 H156 Z" fill="#3a2744"/>
      <path d="M644 690 H694 V732 H644 Z" fill="#3a2744"/>
      <!-- the fallboard and the keys under it -->
      <path d="M150 430 H700 V468 H150 Z" fill="#3a2744"/>
      <path d="M126 468 H724 V512 H126 Z" fill="#f4eaf6" fill-opacity="0.82"/>
      <g fill="#1e1024" fill-opacity="0.8">
        <rect x="170" y="468" width="14" height="28"/><rect x="206" y="468" width="14" height="28"/>
        <rect x="266" y="468" width="14" height="28"/><rect x="302" y="468" width="14" height="28"/>
        <rect x="338" y="468" width="14" height="28"/><rect x="398" y="468" width="14" height="28"/>
        <rect x="434" y="468" width="14" height="28"/><rect x="494" y="468" width="14" height="28"/>
        <rect x="530" y="468" width="14" height="28"/><rect x="566" y="468" width="14" height="28"/>
        <rect x="626" y="468" width="14" height="28"/><rect x="662" y="468" width="14" height="28"/>
      </g>
      <path d="M126 512 H724 V536 H126 Z" fill="#3a2744"/>
      <!-- two pedals, which is what says upright rather than sideboard -->
      <g fill="#c8b2cf" fill-opacity="0.5">
        <rect x="380" y="690" width="36" height="12" rx="5"/>
        <rect x="434" y="690" width="36" height="12" rx="5"/>
      </g>
      <!-- the music desk, folded up against the top panel -->
      <path d="M244 318 H606 V402 H244 Z" fill="#2f1f38" fill-opacity="0.72"/>
      <g stroke="#d8c1dd" stroke-opacity="0.2" stroke-width="4">
        <path d="M274 344 H576M274 366 H576"/>
      </g>
    </g>
  </g>

  <rect class="night" width="1200" height="800" fill="#170c1c"/>
  <rect class="warm" width="1200" height="800" fill="url(#warm)"/>
  <rect width="1200" height="180" fill="url(#settletop)"/>
  <rect y="620" width="1200" height="180" fill="url(#settlebottom)"/>
</svg>
